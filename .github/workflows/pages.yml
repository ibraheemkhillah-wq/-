name: نشر أساس

on:
  # بيئة github-pages تسمح بالنشر من الفرع الافتراضي وحده،
  # فالتشغيل على فروع التطوير يفشل حتمًا ولا فائدة منه
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      # enablement يحاول تفعيل Pages ذاتيًّا (متاح الآن بعد أن صار المستودع عامًّا)
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: تجهيز الموقع
        run: |
          mkdir -p _site
          cp index.html manifest.webmanifest sw.js _site/
          cp icon-180.png icon-512.png icon-1024.png _site/
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
